<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="footer-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <style>
    .f-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .f-quote { font-size: 15px; font-weight: 700; fill: url(#footer-text-grad); letter-spacing: 0.8px; }
    .f-sub { font-size: 12px; font-weight: 500; fill: #94A3B8; }
  </style>

  <rect width="956" height="106" x="2" y="2" rx="14" fill="url(#footer-bg)"/>
  <rect width="956" height="106" x="2" y="2" rx="14" fill="none" stroke="url(#footer-border)" stroke-width="1.5"/>

  <!-- Wave Accent Path -->
  <path d="M 40 55 Q 240 20, 480 55 T 920 55" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8,6"/>

  <text x="480" y="46" text-anchor="middle" class="f-font f-quote">
    "ARCHITECTING SCALABLE CLOUD SYSTEMS • ENGINEERING INTELLIGENT AI SOLUTIONS"
  </text>
  <text x="480" y="74" text-anchor="middle" class="f-font f-sub">
    Crafted with precision by Mohd Salman • Java Full Stack, AI &amp; Cloud Specialist
  </text>
